spring:
  application:
    name: capgemini-test

  # ==================== WriteDB (PostgreSQL) - Base de datos de escritura ====================
  datasource:
    writedb:
      jdbc-url: jdbc:postgresql://localhost:5432/users?useUnicode=true&characterEncoding=UTF-8
      username: user
      password: password
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        idle-timeout: 300000
        connection-timeout: 20000

    # ==================== ReadDB (MySQL) - Réplica de lectura ====================
    readdb:
      jdbc-url: jdbc:mysql://localhost:3306/capgemini_readdb?useUnicode=true&characterEncoding=UTF-8
      username: user
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        idle-timeout: 300000
        connection-timeout: 20000

  # ==================== JPA Configuration ====================
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    # Disable global ddl-auto, each datasource manages its own
    hibernate:
      ddl-auto: validate

  # ==================== Flyway Configuration ====================
  flyway:
    enabled: false
  # ==================== Kafka Configuration ====================
  # Kafka está embebido en la aplicación (no requiere servidor externo)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: readdb-sync-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
    embedded:
      enabled: false

# ==================== Logging ====================
logging:
  level:
    root: INFO
    com.capgemini.test.code: DEBUG
    org.springframework.kafka: WARN
    org.springframework.kafka.listener: ERROR
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.clients.consumer.internals.ConsumerNetworkClient: ERROR
    org.apache.kafka: ERROR
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# ==================== Server Configuration ====================
server:
  port: 8080
  servlet:
    context-path: /api/v1

# ==================== External APIs ====================
external:
  dni-validation:
    url: "http://localhost:1080"
    timeout: 5000
    max-retries: 3
    connection-timeout: 3000

  notification:
    url: "http://localhost:1080"
    timeout: 5000
    max-retries: 2
    connection-timeout: 3000
